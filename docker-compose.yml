services:
  postgres:
    image: postgres:16-alpine
    container_name: moonwitness_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moonwitness_db
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d moonwitness_db]
      interval: 5s
      timeout: 5s
      retries: 10

  # Standalone WhatsApp gateway UI/API. Host port 3001 avoids the API on 3000.
  whatsapp:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    container_name: moonwitness_whatsapp
    restart: unless-stopped
    environment:
      APP_PORT: 3000
      APP_HOST: 0.0.0.0
      APP_BASIC_AUTH: moonwitness:moonwitness
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - gowa_storages:/app/storages

volumes:
  pgdata:
  gowa_storages:
