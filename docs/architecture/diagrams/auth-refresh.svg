<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 810" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">Access and refresh token rotation</title><desc id="diagram-description">Board requests share one in-flight refresh; the API rotates hashed refresh tokens and retries the protected request once.</desc><rect width="100%" height="100%" fill="#fbfaf6"/><text x="32" y="38" fill="#141414" font-family="Arial,sans-serif" font-size="22" font-weight="700">Access and refresh token rotation</text><defs><marker id="arrow-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#435466"/></marker><marker id="arrow-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M 8 0 L 0 4 L 8 8 z" fill="#435466"/></marker></defs><g><rect x="52" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="140" y1="118" x2="140" y2="792" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="140" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Board</text></g><g><rect x="312" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="400" y1="118" x2="400" y2="792" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="400" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Client package</text></g><g><rect x="572" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="660" y1="118" x2="660" y2="792" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="660" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">API</text></g><g><rect x="832" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="920" y1="118" x2="920" y2="792" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="920" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Auth service</text></g><g><rect x="1092" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="1180" y1="118" x2="1180" y2="792" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="1180" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">PostgreSQL</text></g><g><text x="400" y="131" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Request protected resource with access token</text><line x1="232" y1="157" x2="568" y2="157" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="790" y="185" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Validate access token</text><line x1="752" y1="211" x2="828" y2="211" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="790" y="239" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Access token expired</text><line x1="752" y1="265" x2="828" y2="265" stroke="#435466" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-left)"/></g><g><text x="400" y="293" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">401: access token expired</text><line x1="232" y1="319" x2="568" y2="319" stroke="#435466" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-left)"/></g><g><text x="270" y="347" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Queue concurrent requests behind</text><text x="270" y="362" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">one refresh</text><line x1="232" y1="376" x2="308" y2="376" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="530" y="404" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">POST /auth/refresh with refresh</text><text x="530" y="419" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">cookie</text><line x1="492" y1="433" x2="568" y2="433" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="790" y="461" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Hash, validate, and rotate token</text><text x="790" y="476" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">family</text><line x1="752" y1="490" x2="828" y2="490" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="1050" y="518" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Revoke prior token and persist</text><text x="1050" y="533" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">successor</text><line x1="1012" y1="547" x2="1088" y2="547" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="1050" y="575" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Commit rotation</text><line x1="1012" y1="601" x2="1088" y2="601" stroke="#435466" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-left)"/></g><g><text x="790" y="629" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Return new access and refresh</text><text x="790" y="644" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">tokens</text><line x1="752" y1="658" x2="828" y2="658" stroke="#435466" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-left)"/></g><g><text x="530" y="686" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Set rotated cookie and return</text><text x="530" y="701" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">access token</text><line x1="492" y1="715" x2="568" y2="715" stroke="#435466" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-left)"/></g><g><text x="270" y="743" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Retry each queued request once</text><line x1="232" y1="769" x2="308" y2="769" stroke="#435466" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-left)"/></g></svg>
