<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 528" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">Background jobs and transactional outbox</title><desc id="diagram-description">Domain writes and outbox records commit together; workers claim, process, and record retry or dead-letter state.</desc><rect width="100%" height="100%" fill="#fbfaf6"/><text x="32" y="38" fill="#141414" font-family="Arial,sans-serif" font-size="22" font-weight="700">Background jobs and transactional outbox</text><defs><marker id="arrow-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#435466"/></marker><marker id="arrow-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M 8 0 L 0 4 L 8 8 z" fill="#435466"/></marker></defs><g><rect x="52" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="140" y1="118" x2="140" y2="510" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="140" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">API request</text></g><g><rect x="398.6666666666667" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="486.6666666666667" y1="118" x2="486.6666666666667" y2="510" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="486.6666666666667" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">PostgreSQL</text></g><g><rect x="745.3333333333334" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="833.3333333333334" y1="118" x2="833.3333333333334" y2="510" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="833.3333333333334" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Outbox worker</text></g><g><rect x="1092" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="1180" y1="118" x2="1180" y2="510" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="1180" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Idempotent handler</text></g><g><text x="313.33333333333337" y="131" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Write domain state and outbox event in one</text><text x="313.33333333333337" y="146" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">transaction</text><line x1="232" y1="160" x2="394.6666666666667" y2="160" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="313.33333333333337" y="188" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Commit both records atomically</text><line x1="232" y1="214" x2="394.6666666666667" y2="214" stroke="#435466" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-left)"/></g><g><text x="660" y="242" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Claim due rows using a lease and SKIP LOCKED</text><line x1="578.6666666666667" y1="268" x2="741.3333333333334" y2="268" stroke="#435466" stroke-width="1.5" marker-start="url(#arrow-left)"/></g><g><text x="660" y="296" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Return claimed event IDs and payloads</text><line x1="578.6666666666667" y1="322" x2="741.3333333333334" y2="322" stroke="#435466" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-right)"/></g><g><text x="1006.6666666666667" y="350" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Dispatch event with stable event ID</text><line x1="925.3333333333334" y1="376" x2="1088" y2="376" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="1006.6666666666667" y="404" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Acknowledge success or retryable failure</text><line x1="925.3333333333334" y1="430" x2="1088" y2="430" stroke="#435466" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-left)"/></g><g><text x="660" y="458" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Mark delivered, schedule retry, or move</text><text x="660" y="473" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">exhausted event to dead state</text><line x1="578.6666666666667" y1="487" x2="741.3333333333334" y2="487" stroke="#435466" stroke-width="1.5" marker-start="url(#arrow-left)"/></g></svg>
