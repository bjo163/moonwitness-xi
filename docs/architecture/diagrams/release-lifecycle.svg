<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 606" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">Validated promotion and tagged release</title><desc id="diagram-description">The dev-to-main promotion is CI-gated; risky changes require CODEOWNER approval. A tagged version is verified before an explicitly dispatched publish.</desc><rect width="100%" height="100%" fill="#fbfaf6"/><text x="32" y="38" fill="#141414" font-family="Arial,sans-serif" font-size="22" font-weight="700">Validated promotion and tagged release</text><defs><marker id="arrow-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#435466"/></marker><marker id="arrow-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M 8 0 L 0 4 L 8 8 z" fill="#435466"/></marker></defs><g><rect x="52" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="140" y1="118" x2="140" y2="588" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="140" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Developer</text></g><g><rect x="260" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="348" y1="118" x2="348" y2="588" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="348" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">dev branch CI</text></g><g><rect x="468" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="556" y1="118" x2="556" y2="588" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="556" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Promotion workflow</text></g><g><rect x="676" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="764" y1="118" x2="764" y2="588" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="764" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">CODEOWNER / reviewer</text></g><g><rect x="884" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="972" y1="118" x2="972" y2="588" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="972" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">main branch</text></g><g><rect x="1092" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="1180" y1="118" x2="1180" y2="588" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="1180" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Release workflow</text></g><g><text x="244" y="131" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Commit and push reviewed</text><text x="244" y="146" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">work</text><line x1="232" y1="160" x2="256" y2="160" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="452" y="188" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Run full technical CI and</text><text x="452" y="203" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">classify changed risk</text><line x1="440" y1="217" x2="464" y2="217" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="660" y="245" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Request fresh CODEOWNER</text><text x="660" y="260" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">approval for sensitive</text><text x="660" y="275" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">changes</text><line x1="648" y1="289" x2="672" y2="289" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="660" y="317" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Approve sensitive</text><text x="660" y="332" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">promotion</text><line x1="648" y1="346" x2="672" y2="346" stroke="#435466" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-left)"/></g><g><text x="764" y="374" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Merge dev to main only after required gate</text><line x1="648" y1="400" x2="880" y2="400" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="660" y="428" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Create version tag and explicitly dispatch publish</text><line x1="232" y1="454" x2="1088" y2="454" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="1076" y="482" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Verify version, checks,</text><text x="1076" y="497" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">integration, and images</text><line x1="1064" y1="511" x2="1088" y2="511" stroke="#435466" stroke-width="1.5" marker-start="url(#arrow-left)"/></g><g><text x="660" y="539" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Publish images and generated-notes GitHub Release when requested</text><line x1="232" y1="565" x2="1088" y2="565" stroke="#435466" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-left)"/></g></svg>
