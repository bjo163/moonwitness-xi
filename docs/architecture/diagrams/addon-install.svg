<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 666" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">Programmatic addon installation</title><desc id="diagram-description">Addon manifests determine dependency order, model synchronization, seed ownership, and runtime registration without handwritten SQL migration files.</desc><rect width="100%" height="100%" fill="#fbfaf6"/><text x="32" y="38" fill="#141414" font-family="Arial,sans-serif" font-size="22" font-weight="700">Programmatic addon installation</text><defs><marker id="arrow-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#435466"/></marker><marker id="arrow-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M 8 0 L 0 4 L 8 8 z" fill="#435466"/></marker></defs><g><rect x="52" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="140" y1="118" x2="140" y2="648" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="140" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">API or worker startup</text></g><g><rect x="260" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="348" y1="118" x2="348" y2="648" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="348" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Addon manifests</text></g><g><rect x="468" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="556" y1="118" x2="556" y2="648" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="556" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Dependency sorter</text></g><g><rect x="676" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="764" y1="118" x2="764" y2="648" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="764" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">ORM installer</text></g><g><rect x="884" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="972" y1="118" x2="972" y2="648" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="972" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">PostgreSQL</text></g><g><rect x="1092" y="70" width="176" height="48" rx="6" fill="#e8eef3" stroke="#62758a"/><line x1="1180" y1="118" x2="1180" y2="648" stroke="#a6b2bd" stroke-dasharray="5 5"/><text x="1180" y="92" text-anchor="middle" fill="#17212b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Runtime registry</text></g><g><text x="244" y="131" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Load addon definitions</text><text x="244" y="146" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">and dependencies</text><line x1="232" y1="160" x2="256" y2="160" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="452" y="188" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Provide addon manifests</text><text x="452" y="203" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">and dependencies</text><line x1="440" y1="217" x2="464" y2="217" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="660" y="245" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Validate and pass addons</text><text x="660" y="260" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">in dependency order</text><line x1="648" y1="274" x2="672" y2="274" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="868" y="302" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Open transaction and</text><text x="868" y="317" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">acquire install lock</text><line x1="856" y1="331" x2="880" y2="331" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="868" y="359" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Synchronize model schema</text><text x="868" y="374" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">and run versioned</text><text x="868" y="389" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">programmatic upgrades</text><line x1="856" y1="403" x2="880" y2="403" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="868" y="431" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Apply stable external-ID</text><text x="868" y="446" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">seeds and addon versions</text><line x1="856" y1="460" x2="880" y2="460" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="868" y="488" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Commit installation</text><text x="868" y="503" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">transaction</text><line x1="856" y1="517" x2="880" y2="517" stroke="#435466" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-left)"/></g><g><text x="972" y="545" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Register models, views, and menus after commit</text><line x1="856" y1="571" x2="1088" y2="571" stroke="#435466" stroke-width="1.5" marker-end="url(#arrow-right)"/></g><g><text x="660" y="599" text-anchor="middle" fill="#243746" font-family="Arial,sans-serif" font-size="12">Expose installed addon capabilities</text><line x1="232" y1="625" x2="1088" y2="625" stroke="#435466" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-left)"/></g></svg>
