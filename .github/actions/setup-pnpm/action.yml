name: Setup MoonWitness Node workspace
description: Install the pinned Node/pnpm toolchain and frozen workspace dependencies.
inputs:
  node-version:
    description: Node.js major/minor configured for CI
    required: false
    default: '22'
  pnpm-version:
    description: pnpm major used by repository workflows
    required: false
    default: '11'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: ${{ inputs.pnpm-version }}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
    - run: pnpm install --frozen-lockfile
      shell: bash
