name: Refresh promotion report

on:
  workflow_run:
    workflows:
      - CI
      - Documentation Pages
      - CodeQL
      - Gitleaks
      - Roadmap issue sync
      - Roadmap progress report
    types: [completed]
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: promotion-pr-metadata
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current dev and fetch trusted comparison refs
        id: source
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_BRANCH" != "dev" || ! "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Ignoring an invalid workflow-run source identity." >&2
            exit 1
          fi
          current_sha="$(git ls-remote origin refs/heads/dev | cut -f1)"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "Skipping stale source $EXPECTED_SHA; dev is now $current_sha."
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main refs/heads/dev:refs/remotes/origin/dev
          test "$(git rev-parse refs/remotes/origin/dev)" = "$EXPECTED_SHA"
      - name: Find the exact open promotion pull request
        if: steps.source.outputs.stale != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$GH_REPO" --base main --head dev --state open \
            --json number,headRefOid \
            --jq "[.[] | select(.headRefOid == \"$EXPECTED_SHA\")] | if length == 1 then .[0].number else empty end")"
          if [[ -z "$number" ]]; then
            echo "No unique open dev-to-main PR matches $EXPECTED_SHA; nothing to refresh."
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo 'found=true' >> "$GITHUB_OUTPUT"
      - name: Refresh exact-SHA report after hosted checks complete
        if: steps.source.outputs.stale != 'true' && steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          risk_file="$RUNNER_TEMP/promotion-risk.json"
          checks_file="$RUNNER_TEMP/promotion-checks.json"
          release_file="$RUNNER_TEMP/promotion-release-plan.json"
          body_file="$RUNNER_TEMP/promotion-current-body.md"
          report_file="$RUNNER_TEMP/promotion-body.md"
          base_sha="$(git rev-parse refs/remotes/origin/main)"
          node scripts/check-promotion-risk.mjs refs/remotes/origin/main "$EXPECTED_SHA" > "$risk_file"
          gh api "repos/$GH_REPO/commits/$EXPECTED_SHA/check-runs?per_page=100" > "$checks_file"
          pr_head="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json headRefOid --jq '.headRefOid')"
          if [[ "$pr_head" != "$EXPECTED_SHA" ]]; then
            echo "Promotion PR moved from $EXPECTED_SHA to $pr_head; refusing stale report write."
            exit 0
          fi
          gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json body --jq '.body // ""' > "$body_file"
          if [[ -n "$(git tag --list 'v[0-9]*')" ]]; then
            node scripts/release-plan.mjs --head "$EXPECTED_SHA" --json > "$release_file"
          else
            printf '{"status":"unavailable"}\n' > "$release_file"
          fi
          node scripts/render-promotion-report.mjs \
            "$base_sha" "$EXPECTED_SHA" "$risk_file" "$checks_file" \
            "$release_file" "$body_file" "$report_file" "$GH_REPO"
          current_sha="$(git ls-remote origin refs/heads/dev | cut -f1)"
          pr_head="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json headRefOid --jq '.headRefOid')"
          if [[ "$current_sha" != "$EXPECTED_SHA" || "$pr_head" != "$EXPECTED_SHA" ]]; then
            echo "Source or PR changed during report generation; refusing stale write."
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --body-file "$report_file"
