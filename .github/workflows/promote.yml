name: Promote dev to main

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-write-coordinator
  cancel-in-progress: false

jobs:
  promote:
    name: create-promotion-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      checks: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Skip stale promotion events
        id: stale
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_REF" != "refs/heads/dev" ]]; then
            echo "Promotion must run from dev, received $EVENT_REF" >&2
            exit 1
          fi
          current_sha="$(git ls-remote origin refs/heads/dev | cut -f1)"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "Skipping stale event for $EXPECTED_SHA; dev is now $current_sha"
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main refs/heads/dev:refs/remotes/origin/dev
      - name: Create or find the promotion pull request
        if: steps.stale.outputs.stale != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          number="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            url="$(gh pr create \
              --base main \
              --head dev \
              --title "Promote dev to main" \
              --body "Automated promotion of the validated dev branch. Required CI gate: ci-gate. Merge method: merge commit.")"
            number="${url##*/}"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Classify risk from commits and changed paths
        if: steps.stale.outputs.stale != 'true'
        id: risk
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          node scripts/check-promotion-risk.mjs refs/remotes/origin/main "$EXPECTED_SHA" > "$RUNNER_TEMP/promotion-risk.json"
          node scripts/check-promotion-risk.mjs refs/remotes/origin/main "$EXPECTED_SHA" --summary >> "$GITHUB_OUTPUT"
      - name: Refresh exact-SHA promotion report
        if: steps.stale.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ github.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          risk_file="$RUNNER_TEMP/promotion-risk.json"
          checks_file="$RUNNER_TEMP/promotion-checks.json"
          release_file="$RUNNER_TEMP/promotion-release-plan.json"
          body_file="$RUNNER_TEMP/promotion-current-body.md"
          report_file="$RUNNER_TEMP/promotion-body.md"
          base_sha="$(git rev-parse refs/remotes/origin/main)"
          gh api "repos/$GH_REPO/commits/$EXPECTED_SHA/check-runs?per_page=100" > "$checks_file"
          gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json body --jq '.body // ""' > "$body_file"
          if [[ -n "$(git tag --list 'v[0-9]*')" ]]; then
            node scripts/release-plan.mjs --head "$EXPECTED_SHA" --json > "$release_file"
          else
            printf '{"status":"unavailable"}\n' > "$release_file"
          fi
          node scripts/render-promotion-report.mjs \
            "$base_sha" "$EXPECTED_SHA" "$risk_file" "$checks_file" \
            "$release_file" "$body_file" "$report_file" "$GH_REPO"
          gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --body-file "$report_file"
      - name: Ensure approval-required label exists
        if: steps.stale.outputs.stale != 'true' && steps.risk.outputs.approval_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh label create approval-required --repo "$GH_REPO" --color B60205 --description "Risk classifier requires a fresh CODEOWNER approval" --force
      - name: Disable auto-merge and mark sensitive promotion
        if: steps.stale.outputs.stale != 'true' && steps.risk.outputs.approval_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --add-label approval-required
          auto_merge="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "$auto_merge" == "true" ]]; then
            gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --disable-auto
          fi
          echo "Promotion requires a fresh CODEOWNER approval and a manual merge. Reasons: ${{ steps.risk.outputs.reasons }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Enable merge for compatible, low-risk promotion
        if: steps.stale.outputs.stale != 'true' && steps.risk.outputs.approval_required != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          labels="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json labels --jq '[.labels[].name]')"
          if jq -e 'index("approval-required") != null' <<< "$labels" >/dev/null; then
            gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --remove-label approval-required
          fi
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --auto --merge --match-head-commit "$EXPECTED_SHA"
