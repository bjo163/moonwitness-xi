name: Promote dev to main

on:
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: create-promotion-pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Skip stale promotion events
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(git ls-remote origin refs/heads/dev | cut -f1)"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "Skipping stale event for $EXPECTED_SHA; dev is now $current_sha"
            exit 0
          fi
      - name: Create or find the promotion pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          number="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            url="$(gh pr create \
              --base main \
              --head dev \
              --title "Promote dev to main" \
              --body "Automated promotion of the validated dev branch. Required CI gate: ci-gate. Merge method: merge commit.")"
            number="${url##*/}"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Enable merge after required checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --auto --merge
