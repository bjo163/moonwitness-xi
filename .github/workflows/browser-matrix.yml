name: Scheduled browser matrix

on:
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    name: Board E2E ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      MW_E2E_BROWSER_MATRIX: 'true'
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11.17.0'
      - name: Install browser and operating-system dependencies
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run Board browser suite
        run: pnpm test:e2e --project=${{ matrix.browser }}
      - name: Scan browser reports for secrets before artifact upload
        id: scan_reports
        if: always()
        run: node scripts/scan-test-reports.mjs
      - name: Upload sanitized browser reports and screenshots
        if: always() && steps.scan_reports.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: board-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/junit/board-e2e.xml
            test-results/junit/board-e2e-retries.json
            test-results/playwright/**/*.png
          if-no-files-found: ignore
          retention-days: 7
