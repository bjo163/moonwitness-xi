name: Release dry-run plan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Generate a read-only release plan
        run: pnpm release:dry-run -- --output "$RUNNER_TEMP/release-plan.json"
      - name: Summarize planned version, assets, and pending gates
        run: |
          set -euo pipefail
          jq -r '"### Release dry-run\n- Status: `\(.status)`\n- Source SHA: `\(.source.headSha)`\n- Proposed version: `\(.version // "none")`\n- Planned assets: \(.assets | length)\n- Required assets not implemented: \(.readinessFindings | length)\n- Gates not run: \([.gates[] | select(.status == "not-run")] | length)\n- Writes performed: `\(.writesPerformed)`"' "$RUNNER_TEMP/release-plan.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the release plan for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan-${{ github.sha }}
          path: ${{ runner.temp }}/release-plan.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
