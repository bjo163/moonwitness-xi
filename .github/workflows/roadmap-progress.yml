name: Roadmap progress report

on:
  push:
    branches: [dev]
  schedule:
    - cron: '47 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-progress-report
  cancel-in-progress: true

jobs:
  report:
    name: generate source-bound progress artifact
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Prepare progress report directory
        run: mkdir -p dist/roadmap-progress
      - name: Generate Markdown progress report
        run: node scripts/roadmap/progress-dashboard.mjs --output dist/roadmap-progress/roadmap-progress.md
      - name: Generate JSON progress report
        run: node scripts/roadmap/progress-dashboard.mjs --format json --output dist/roadmap-progress/roadmap-progress.json
      - name: Upload read-only roadmap progress artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: roadmap-progress-${{ github.run_id }}
          path: dist/roadmap-progress/
          if-no-files-found: error
          retention-days: 7
