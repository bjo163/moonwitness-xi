name: Deep scheduled regression

on:
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-recovery:
    name: PostgreSQL upgrade, jobs recovery, and restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      REQUIRE_POSTGRES_TESTS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Run PostgreSQL upgrade and recovery integration suite
        run: pnpm test:integration
      - name: Run jobs queue and recovery suite
        run: pnpm --filter @moonwitness/jobs test
      - name: Install PostgreSQL client for isolated backup and restore
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
      - name: Run isolated application restore drill
        run: pnpm test:restore-drill
      - name: Scan reports for secrets before upload
        id: scan_reports
        if: always()
        run: node scripts/scan-test-reports.mjs
      - name: Upload sanitized PostgreSQL report
        if: always() && steps.scan_reports.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deep-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/junit/postgres.xml
          if-no-files-found: ignore
          retention-days: 14
