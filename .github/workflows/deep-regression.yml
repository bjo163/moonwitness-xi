name: Deep scheduled regression

on:
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-recovery:
    name: PostgreSQL upgrade, jobs recovery, and restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      REQUIRE_POSTGRES_TESTS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Run PostgreSQL upgrade and recovery integration suite
        run: pnpm test:integration
      - name: Run jobs queue and recovery suite
        run: pnpm --filter @moonwitness/jobs test
      - name: Install PostgreSQL client for isolated backup and restore
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
      - name: Run isolated application restore drill
        run: pnpm test:restore-drill
      - name: Scan reports for secrets before upload
        id: scan_reports
        if: always()
        run: node scripts/scan-test-reports.mjs
      - name: Upload sanitized PostgreSQL report
        if: always() && steps.scan_reports.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deep-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/junit/postgres.xml
          if-no-files-found: ignore
          retention-days: 14

  report-failure:
    name: Report deep regression failure
    if: always() && needs.postgres-recovery.result == 'failure' && github.ref == 'refs/heads/main'
    needs: [postgres-recovery]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: repository-write-coordinator
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Upsert the deep regression incident
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          INCIDENT_CATEGORY: deep-regression
          INCIDENT_STATUS: failed
        run: node scripts/maintenance-incident.mjs

  resolve-failure:
    name: Resolve recovered deep regression
    if: always() && needs.postgres-recovery.result == 'success' && github.ref == 'refs/heads/main'
    needs: [postgres-recovery]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: repository-write-coordinator
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve the incident after a successful deep regression
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          INCIDENT_CATEGORY: deep-regression
          INCIDENT_STATUS: recovered
        run: node scripts/maintenance-incident.mjs
