name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
      - name: Verify PostgreSQL backup and restore
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          psql "$POSTGRES_TEST_URL" -X -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.backup_verification (value text NOT NULL)'
          psql "$POSTGRES_TEST_URL" -X -v ON_ERROR_STOP=1 -c "INSERT INTO public.backup_verification VALUES ('restore-ok')"
          backup_file="$(BACKUP_DIR="$RUNNER_TEMP/moonwitness-backups" bash scripts/backup-postgres.sh)"
          restore_db="moonwitness_restore_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          createdb --maintenance-db="$POSTGRES_TEST_URL" "$restore_db"
          trap 'dropdb --maintenance-db="$POSTGRES_TEST_URL" "$restore_db" || true' EXIT
          restore_url="${POSTGRES_TEST_URL%/*}/$restore_db"
          pg_restore --exit-on-error --no-owner --no-acl --dbname="$restore_url" "$backup_file"
          restored="$(psql "$restore_url" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT value FROM public.backup_verification')"
          test "$restored" = 'restore-ok'
