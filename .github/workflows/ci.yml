name: CI

on:
  pull_request:
    branches: [dev, main]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.affected.outputs.projects }}
      approval-required: ${{ steps.risk.outputs.approval_required }}
      promotion-head: ${{ steps.risk.outputs.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Select affected CI projects (promotion is always full)
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$BASE_REF" == "main" || "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo 'projects=["quality","integration","browser","containers","automation","ui"]' >> "$GITHUB_OUTPUT"
            echo 'plan={"mode":"full","reason":"full-validation","projects":["quality","integration","browser","containers","automation","ui"]}' >> "$GITHUB_OUTPUT"
          else
            base_sha="${BASE_SHA:-$(git rev-parse origin/main)}"
            pnpm ci:affected "$base_sha" "$HEAD_SHA" --json
          fi
      - name: Validate Conventional Commit history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base_sha="${BASE_SHA:-$(git rev-parse origin/main)}"
          pnpm release:classify "$base_sha" "$HEAD_SHA" --summary
      - name: Classify promotion risk from commit history and diff
        id: risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base_sha="${BASE_SHA:-$(git rev-parse origin/main)}"
          node scripts/check-promotion-risk.mjs "$base_sha" "$HEAD_SHA" --summary >> "$GITHUB_OUTPUT"

  quality:
    name: quality
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'quality')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:architecture
      - run: pnpm architecture:check
      - run: pnpm assets:check:docs
      - run: pnpm docs:build
      - name: Lint Board
        run: pnpm --filter @moonwitness/board lint

  automation:
    name: automation
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'automation')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Validate workflows and shell scripts
        run: bash scripts/check-automation.sh && pnpm automation:check:action-pins && pnpm automation:check:secrets && pnpm automation:check:roadmap
      - name: Test affected selection, release planning, and promotion policy
        run: pnpm test:ci-gate && pnpm test:affected && pnpm test:release-classification && pnpm test:release-plan && pnpm test:render-changelog && pnpm test:workspace-version-policy && pnpm test:action-pins && pnpm test:secrets && pnpm test:roadmap && pnpm test:platform-audit && pnpm test:promotion-policy && pnpm test:flaky-policy && pnpm test:security-policy && pnpm test:dependency-plan && pnpm test:dependency-candidate && pnpm test:expected-ref && node scripts/check-flaky-policy.mjs
      - name: Validate vulnerability exception baseline
        run: node scripts/check-vulnerability-policy.mjs

  integration:
    name: integration
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'integration')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      REQUIRE_POSTGRES_TESTS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Run unit tests and write JUnit reports
        run: pnpm test:unit:ci
      - run: pnpm test:integration
      - name: Scan reports for secrets before artifact upload
        id: scan_reports
        if: always()
        run: node scripts/scan-test-reports.mjs
      - name: Upload unit and integration test reports
        if: always() && steps.scan_reports.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/junit/
            test-results/coverage/
            test-results/performance/
          if-no-files-found: ignore
          retention-days: 14
      - name: Run isolated application backup and restore drill
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          pnpm test:restore-drill

  browser:
    name: browser
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'browser')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Install Chromium and operating-system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Board browser tests
        run: pnpm test:e2e
      - name: Test documentation portal routing, search, and responsive navigation
        run: pnpm test:docs-portal
      - name: Scan browser reports for secrets before artifact upload
        id: scan_browser_reports
        if: always()
        run: node scripts/scan-test-reports.mjs
      - name: Upload browser JUnit report and screenshots only
        if: always() && steps.scan_browser_reports.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: board-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/junit/board-e2e.xml
            test-results/junit/board-e2e-retries.json
            test-results/junit/docs-portal.xml
            test-results/playwright/**/*.png
            test-results/visual-audit/**/*.png
            test-results/docs-portal/**/*.png
            test-results/docs-portal/**/*.zip
          if-no-files-found: ignore
          retention-days: 7

  ui:
    name: ui
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'ui')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Install Chromium and operating-system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Test shared UI package public exports and component contracts
        run: pnpm test:ui
      - name: Validate source SVG assets and static documentation exports
        run: pnpm test:assets
      - name: Enforce tested JavaScript and CSS bundle budgets
        run: pnpm test:ui-budget
      - name: Test UI catalog interactions, WCAG, and visual contract
        run: pnpm --filter @moonwitness/ui-catalog test
      - name: Scan UI browser reports before artifact upload
        id: scan_ui_reports
        if: always()
        run: node scripts/scan-test-reports.mjs
      - name: Upload UI browser report and visual screenshots only
        if: always() && steps.scan_ui_reports.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-catalog-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/junit/ui-catalog.xml
            test-results/ui-catalog/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: containers
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'containers')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate production Compose configuration
        env:
          DATABASE_URL: postgresql://moonwitness:ci-password@postgres.example:5432/moonwitness
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Smoke test API and Board containers against isolated PostgreSQL
        run: bash scripts/smoke-containers.sh
      - name: Scan locked workspace runtime dependencies for CRITICAL vulnerabilities
        id: trivy-workspace
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
      - name: Scan production API image for CRITICAL vulnerabilities
        id: trivy-api-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: moonwitness-api:production
          vuln-type: os,library
          ignore-unfixed: true
          format: sarif
          output: trivy-api-image.sarif
          exit-code: '0'
      - name: Scan production Board image for CRITICAL vulnerabilities
        id: trivy-board-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: moonwitness-board:production
          vuln-type: os,library
          ignore-unfixed: true
          format: sarif
          output: trivy-board-image.sarif
          exit-code: '0'
      - name: Upload locked workspace scan SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-workspace-dependencies
      - name: Upload production API image scan SARIF
        if: always() && hashFiles('trivy-api-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-api-image.sarif
          category: trivy-api-image
      - name: Upload production Board image scan SARIF
        if: always() && hashFiles('trivy-board-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-board-image.sarif
          category: trivy-board-image
      - name: Require successful scans and block CRITICAL vulnerabilities
        if: always()
        env:
          TRIVY_SCAN_OUTCOMES: '["${{ steps.trivy-workspace.outcome }}","${{ steps.trivy-api-image.outcome }}","${{ steps.trivy-board-image.outcome }}"]'
        run: node scripts/check-trivy-sarif.mjs trivy-results.sarif trivy-api-image.sarif trivy-board-image.sarif
  ci-gate:
    name: ci-gate
    if: always()
    needs: [plan, quality, integration, browser, containers, automation, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Test CI gate decisions
        run: pnpm test:ci-gate && pnpm test:artifact-safety
      - name: Write CI job summary
        if: always()
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SELECTED_JOBS: ${{ needs.plan.outputs.projects }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          AUTOMATION_RESULT: ${{ needs.automation.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: |
          PLAN_RESULT="$PLAN_RESULT" \
          SELECTED_JOBS="$SELECTED_JOBS" \
          QUALITY_RESULT="$QUALITY_RESULT" \
          INTEGRATION_RESULT="$INTEGRATION_RESULT" \
          BROWSER_RESULT="$BROWSER_RESULT" \
          CONTAINERS_RESULT="$CONTAINERS_RESULT" \
          AUTOMATION_RESULT="$AUTOMATION_RESULT" \
          UI_RESULT="$UI_RESULT" \
          node scripts/ci-gate.mjs || true
      - name: Require every mandatory job to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SELECTED_JOBS: ${{ needs.plan.outputs.projects }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          AUTOMATION_RESULT: ${{ needs.automation.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: |
          PLAN_RESULT="$PLAN_RESULT" \
          SELECTED_JOBS="$SELECTED_JOBS" \
          QUALITY_RESULT="$QUALITY_RESULT" \
          INTEGRATION_RESULT="$INTEGRATION_RESULT" \
          BROWSER_RESULT="$BROWSER_RESULT" \
          CONTAINERS_RESULT="$CONTAINERS_RESULT" \
          AUTOMATION_RESULT="$AUTOMATION_RESULT" \
          UI_RESULT="$UI_RESULT" \
          node scripts/ci-gate.mjs
      - name: Require fresh CODEOWNER approval for sensitive promotions
        if: needs.plan.outputs.approval-required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ needs.plan.outputs.promotion-head }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if [[ -z "$PR_NUMBER" ]]; then
            PR_NUMBER="$(gh pr list --repo "$GH_REPO" --base main --head dev --state open --json number --jq '.[0].number // empty')"
          fi
          if [[ -z "$PR_NUMBER" ]]; then
            echo "Sensitive change requires an open promotion PR and a current CODEOWNER approval." >&2
            exit 1
          fi
          reviews_file="$RUNNER_TEMP/promotion-reviews.json"
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" > "$reviews_file"
          node scripts/check-promotion-approval.mjs "$HEAD_SHA" "$reviews_file"
