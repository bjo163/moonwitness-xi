name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.affected.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Select affected CI projects (promotion is always full)
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$BASE_REF" == "main" || "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo 'projects=["quality","integration","browser","containers","automation"]' >> "$GITHUB_OUTPUT"
            echo 'plan={"mode":"full","reason":"main-promotion","projects":["quality","integration","browser","containers","automation"]}' >> "$GITHUB_OUTPUT"
          else
            pnpm ci:affected "$BASE_SHA" "$HEAD_SHA" --json
          fi

  quality:
    name: quality
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'quality')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm docs:check
      - name: Lint Board
        run: pnpm --filter @moonwitness/board lint

  automation:
    name: automation
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'automation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Validate GitHub workflows
        run: docker run --rm -v "$PWD:/work" -w /work rhysd/actionlint:1.7.7 -color .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/promote.yml
      - name: Test affected workspace selection and gate behavior
        run: pnpm test:ci-gate && pnpm test:affected

  integration:
    name: integration
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'integration')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      REQUIRE_POSTGRES_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - run: pnpm test:unit
      - run: pnpm test:integration
      - name: Verify PostgreSQL backup and restore
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          psql "$POSTGRES_TEST_URL" -X -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.backup_verification (value text NOT NULL)'
          psql "$POSTGRES_TEST_URL" -X -v ON_ERROR_STOP=1 -c "INSERT INTO public.backup_verification VALUES ('restore-ok')"
          backup_file="$(BACKUP_DIR="$RUNNER_TEMP/moonwitness-backups" bash scripts/backup-postgres.sh)"
          restore_db="moonwitness_restore_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          createdb --maintenance-db="$POSTGRES_TEST_URL" "$restore_db"
          trap 'dropdb --maintenance-db="$POSTGRES_TEST_URL" "$restore_db" || true' EXIT
          restore_url="${POSTGRES_TEST_URL%/*}/$restore_db"
          if printf 'wrong-database-name\n' | DATABASE_URL="$restore_url" BACKUP_FILE="$backup_file" ALLOW_DATABASE_RESTORE=true bash scripts/restore-postgres.sh; then
            echo "Restore accepted a mismatched database confirmation" >&2
            exit 1
          fi
          printf '%s\n' "$restore_db" | DATABASE_URL="$restore_url" BACKUP_FILE="$backup_file" ALLOW_DATABASE_RESTORE=true bash scripts/restore-postgres.sh
          restored="$(psql "$restore_url" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT value FROM public.backup_verification')"
          test "$restored" = 'restore-ok'

  browser:
    name: browser
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'browser')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Install Chromium and operating-system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Board browser tests
        run: pnpm test:e2e
      - name: Upload browser report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: containers
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'containers')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production API container
        run: docker build --tag moonwitness-api:ci .
      - name: Build production Board container
        run: docker build --target board-runtime --tag moonwitness-board:ci .
      - name: Validate production Compose configuration
        env:
          DATABASE_URL: postgresql://moonwitness:ci-password@postgres.example:5432/moonwitness
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
        run: docker compose -f docker-compose.production.yml config --quiet
  ci-gate:
    name: ci-gate
    if: always()
    needs: [plan, quality, integration, browser, containers, automation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Test CI gate decisions
        run: pnpm test:ci-gate
      - name: Require every mandatory job to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SELECTED_JOBS: ${{ needs.plan.outputs.projects }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          AUTOMATION_RESULT: ${{ needs.automation.result }}
        run: |
          PLAN_RESULT="$PLAN_RESULT" \
          SELECTED_JOBS="$SELECTED_JOBS" \
          QUALITY_RESULT="$QUALITY_RESULT" \
          INTEGRATION_RESULT="$INTEGRATION_RESULT" \
          BROWSER_RESULT="$BROWSER_RESULT" \
          CONTAINERS_RESULT="$CONTAINERS_RESULT" \
          AUTOMATION_RESULT="$AUTOMATION_RESULT" \
          node scripts/ci-gate.mjs
