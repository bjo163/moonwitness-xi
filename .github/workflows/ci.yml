name: CI

on:
  pull_request:
    branches: [dev, main]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.affected.outputs.projects }}
      approval-required: ${{ steps.risk.outputs.approval_required }}
      promotion-head: ${{ steps.risk.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Select affected CI projects (promotion is always full)
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$BASE_REF" == "main" || "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo 'projects=["quality","integration","browser","containers","automation"]' >> "$GITHUB_OUTPUT"
            echo 'plan={"mode":"full","reason":"full-validation","projects":["quality","integration","browser","containers","automation"]}' >> "$GITHUB_OUTPUT"
          else
            base_sha="${BASE_SHA:-$(git rev-parse origin/main)}"
            pnpm ci:affected "$base_sha" "$HEAD_SHA" --json
          fi
      - name: Validate Conventional Commit history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base_sha="${BASE_SHA:-$(git rev-parse origin/main)}"
          pnpm release:classify "$base_sha" "$HEAD_SHA" --summary
      - name: Classify promotion risk from commit history and diff
        id: risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base_sha="${BASE_SHA:-$(git rev-parse origin/main)}"
          node scripts/check-promotion-risk.mjs "$base_sha" "$HEAD_SHA" --summary >> "$GITHUB_OUTPUT"

  quality:
    name: quality
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'quality')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm docs:check
      - name: Lint Board
        run: pnpm --filter @moonwitness/board lint

  automation:
    name: automation
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'automation')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Validate GitHub workflows
        run: docker run --rm -v "$PWD:/work" -w /work rhysd/actionlint:1.7.7 -color .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/promote.yml .github/workflows/sync-main-to-dev.yml
      - name: Test affected selection, release classification, and promotion policy
        run: pnpm test:ci-gate && pnpm test:affected && pnpm test:release-classification && pnpm test:promotion-policy

  integration:
    name: integration
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'integration')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      REQUIRE_POSTGRES_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Run unit tests and write JUnit reports
        run: pnpm test:unit:ci
      - run: pnpm test:integration
      - name: Scan reports for secrets before artifact upload
        id: scan_reports
        if: always()
        run: node scripts/scan-test-reports.mjs
      - name: Upload unit and integration test reports
        if: always() && steps.scan_reports.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: test-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/junit/
            test-results/coverage/api/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify PostgreSQL backup and restore
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          psql "$POSTGRES_TEST_URL" -X -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.backup_verification (value text NOT NULL)'
          psql "$POSTGRES_TEST_URL" -X -v ON_ERROR_STOP=1 -c "INSERT INTO public.backup_verification VALUES ('restore-ok')"
          backup_file="$(BACKUP_DIR="$RUNNER_TEMP/moonwitness-backups" bash scripts/backup-postgres.sh)"
          restore_db="moonwitness_restore_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          createdb --maintenance-db="$POSTGRES_TEST_URL" "$restore_db"
          trap 'dropdb --maintenance-db="$POSTGRES_TEST_URL" "$restore_db" || true' EXIT
          restore_url="${POSTGRES_TEST_URL%/*}/$restore_db"
          if printf 'wrong-database-name\n' | DATABASE_URL="$restore_url" BACKUP_FILE="$backup_file" ALLOW_DATABASE_RESTORE=true bash scripts/restore-postgres.sh; then
            echo "Restore accepted a mismatched database confirmation" >&2
            exit 1
          fi
          printf '%s\n' "$restore_db" | DATABASE_URL="$restore_url" BACKUP_FILE="$backup_file" ALLOW_DATABASE_RESTORE=true bash scripts/restore-postgres.sh
          restored="$(psql "$restore_url" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT value FROM public.backup_verification')"
          test "$restored" = 'restore-ok'

  browser:
    name: browser
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'browser')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Install Chromium and operating-system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Board browser tests
        run: pnpm test:e2e
      - name: Scan browser reports for secrets before artifact upload
        id: scan_browser_reports
        if: always()
        run: node scripts/scan-test-reports.mjs
      - name: Upload browser JUnit report and screenshots only
        if: always() && steps.scan_browser_reports.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: board-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/junit/board-e2e.xml
            test-results/playwright/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: containers
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.projects), 'containers')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        env:
          DATABASE_URL: postgresql://moonwitness:ci-password@postgres.example:5432/moonwitness
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Smoke test API and Board containers against isolated PostgreSQL
        run: bash scripts/smoke-containers.sh
  ci-gate:
    name: ci-gate
    if: always()
    needs: [plan, quality, integration, browser, containers, automation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Test CI gate decisions
        run: pnpm test:ci-gate && pnpm test:artifact-safety
      - name: Write CI job summary
        if: always()
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SELECTED_JOBS: ${{ needs.plan.outputs.projects }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          AUTOMATION_RESULT: ${{ needs.automation.result }}
        run: |
          PLAN_RESULT="$PLAN_RESULT" \
          SELECTED_JOBS="$SELECTED_JOBS" \
          QUALITY_RESULT="$QUALITY_RESULT" \
          INTEGRATION_RESULT="$INTEGRATION_RESULT" \
          BROWSER_RESULT="$BROWSER_RESULT" \
          CONTAINERS_RESULT="$CONTAINERS_RESULT" \
          AUTOMATION_RESULT="$AUTOMATION_RESULT" \
          node scripts/ci-gate.mjs || true
      - name: Require every mandatory job to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SELECTED_JOBS: ${{ needs.plan.outputs.projects }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          AUTOMATION_RESULT: ${{ needs.automation.result }}
        run: |
          PLAN_RESULT="$PLAN_RESULT" \
          SELECTED_JOBS="$SELECTED_JOBS" \
          QUALITY_RESULT="$QUALITY_RESULT" \
          INTEGRATION_RESULT="$INTEGRATION_RESULT" \
          BROWSER_RESULT="$BROWSER_RESULT" \
          CONTAINERS_RESULT="$CONTAINERS_RESULT" \
          AUTOMATION_RESULT="$AUTOMATION_RESULT" \
          node scripts/ci-gate.mjs
      - name: Require fresh CODEOWNER approval for sensitive promotions
        if: needs.plan.outputs.approval-required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ needs.plan.outputs.promotion-head }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if [[ -z "$PR_NUMBER" ]]; then
            PR_NUMBER="$(gh pr list --repo "$GH_REPO" --base main --head dev --state open --json number --jq '.[0].number // empty')"
          fi
          if [[ -z "$PR_NUMBER" ]]; then
            echo "Sensitive change requires an open promotion PR and a current CODEOWNER approval." >&2
            exit 1
          fi
          reviews_file="$RUNNER_TEMP/promotion-reviews.json"
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" > "$reviews_file"
          node scripts/check-promotion-approval.mjs "$HEAD_SHA" "$reviews_file"
