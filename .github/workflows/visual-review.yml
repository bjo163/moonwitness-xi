name: Visual review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-review-dev
  cancel-in-progress: true

jobs:
  screenshots:
    name: render reviewed baseline candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_e2e
    steps:
      - name: Require the protected development branch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/dev" ]]; then
            echo "Visual review must be dispatched from the protected dev branch." >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Install Chromium and operating-system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Render approved comparison candidates
        run: pnpm test:e2e --grep "responsive screen audit|responsive protected screens"
      - name: Scan reports before publishing screenshots
        if: always()
        run: node scripts/scan-test-reports.mjs
      - name: Publish screenshots for human review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/visual-audit/**/*.png
          if-no-files-found: error
          retention-days: 14
