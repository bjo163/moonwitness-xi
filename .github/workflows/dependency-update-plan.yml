name: Dependency update plan

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-update-plan
  cancel-in-progress: true

jobs:
  plan:
    name: generate read-only dependency candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          fetch-depth: 1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Generate dependency candidate plan without writes
        run: node scripts/dependency-update-plan.mjs --output dependency-update-plan.json
      - name: Upload dependency candidate plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-update-plan-${{ github.run_id }}
          path: dependency-update-plan.json
          if-no-files-found: error
          retention-days: 7
