name: Dependency update plan

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-update-plan
  cancel-in-progress: true

jobs:
  plan:
    name: generate read-only dependency candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Generate dependency candidate plan without writes
        run: node scripts/dependency-update-plan.mjs --output dependency-update-plan.json
      - name: Upload dependency candidate plan
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dependency-update-plan-${{ github.run_id }}
          path: dependency-update-plan.json
          if-no-files-found: error
          retention-days: 7
