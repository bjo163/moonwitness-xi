name: Apply tested dependency candidate

on:
  workflow_dispatch:
    inputs:
      package:
        description: Exact package name from the dependency update plan (Actions are report-only)
        required: true
        type: string
      version:
        description: Exact wanted patch/minor version from the plan (major versions are report-only)
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: test-one-dependency-on-source-sha
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_candidate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_candidate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_candidate_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_candidate_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
      candidate-sha: ${{ steps.commit.outputs.sha }}
      package: ${{ steps.plan.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Record current dev source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select one exact non-major package candidate from current plan
        id: plan
        env:
          PACKAGE: ${{ inputs.package }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          candidate="$(pnpm dependency:plan --select "$PACKAGE" --source-sha "$SOURCE_SHA")"
          echo "$candidate" > "$RUNNER_TEMP/dependency-candidate.json"
          node -e 'const c=require(process.argv[1]); if(c.version!==process.env.REQUESTED_VERSION) throw new Error("Requested version differs from current wanted version"); process.stdout.write("package="+c.packageName+"\n")' "$RUNNER_TEMP/dependency-candidate.json" >> "$GITHUB_OUTPUT"
      - name: Create disposable candidate worktree
        run: git worktree add --detach "$RUNNER_TEMP/candidate" "${{ steps.source.outputs.sha }}"
      - name: Apply one patch/minor package update and run full candidate checks
        env:
          PACKAGE: ${{ steps.plan.outputs.package }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          node scripts/dependency-candidate.mjs --package "$PACKAGE" --version "$VERSION" --source-sha "$SOURCE_SHA" --expected-source-sha "$SOURCE_SHA" --root "$RUNNER_TEMP/candidate"
      - name: Validate patch/minor promotion risk
        run: node scripts/check-promotion-risk.mjs "${{ steps.source.outputs.sha }}" HEAD --summary
      - name: Build candidate API and Board images
        working-directory: ${{ runner.temp }}/candidate
        run: |
          docker build --tag moonwitness-api:candidate .
          docker build --target board-runtime --tag moonwitness-board:candidate .
      - name: Scan candidate workspace dependencies for CRITICAL vulnerabilities
        id: trivy-workspace
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/candidate
          scanners: vuln
          ignore-unfixed: true
          format: sarif
          output: ${{ runner.temp }}/trivy-candidate-workspace.sarif
          exit-code: '0'
      - name: Scan candidate API image for CRITICAL vulnerabilities
        id: trivy-api
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: moonwitness-api:candidate
          vuln-type: os,library
          ignore-unfixed: true
          format: sarif
          output: ${{ runner.temp }}/trivy-candidate-api.sarif
          exit-code: '0'
      - name: Scan candidate Board image for CRITICAL vulnerabilities
        id: trivy-board
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: moonwitness-board:candidate
          vuln-type: os,library
          ignore-unfixed: true
          format: sarif
          output: ${{ runner.temp }}/trivy-candidate-board.sarif
          exit-code: '0'
      - name: Block candidate scanner errors and CRITICAL findings
        working-directory: ${{ runner.temp }}/candidate
        env:
          TRIVY_SCAN_OUTCOMES: '["${{ steps.trivy-workspace.outcome }}","${{ steps.trivy-api.outcome }}","${{ steps.trivy-board.outcome }}"]'
        run: node scripts/check-trivy-sarif.mjs "$RUNNER_TEMP/trivy-candidate-workspace.sarif" "$RUNNER_TEMP/trivy-candidate-api.sarif" "$RUNNER_TEMP/trivy-candidate-board.sarif"
      - name: Create candidate commit after verification
        id: commit
        env:
          PACKAGE: ${{ steps.plan.outputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed_files="$(git diff --name-only | sort)"
          if ! grep -Fxq 'pnpm-lock.yaml' <<< "$changed_files" || ! grep -Eq '(^|/)package\.json$' <<< "$changed_files"; then
            echo "Candidate contains unexpected changed files:" >&2
            printf '%s\n' "$changed_files" >&2
            exit 1
          fi
          while IFS= read -r path; do
            [[ "$path" == "pnpm-lock.yaml" || "$path" == "package.json" || "$path" == */package.json ]] || { echo "Unexpected candidate path: $path" >&2; exit 1; }
          done <<< "$changed_files"
          git add -u
          git diff --cached --check
          git commit -m "chore(deps): update $PACKAGE to $VERSION"
          git bundle create "$RUNNER_TEMP/dependency-candidate.bundle" HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload verified candidate bundle and metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dependency-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/dependency-candidate.bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    name: verify-head-and-fast-forward-dev
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: repository-write-coordinator
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
      - name: Download verified candidate bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dependency-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Refuse stale source or unexpected candidate parent, then fast-forward dev
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.candidate.outputs.source-sha }}
          EXPECTED_CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate-sha }}
        run: |
          set -euo pipefail
          current_dev="$(git ls-remote origin refs/heads/dev | cut -f1)"
          if [[ "$current_dev" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "Candidate is stale: expected dev $EXPECTED_SOURCE_SHA, current dev is $current_dev. No write performed." >&2
            exit 1
          fi
          git fetch --no-tags origin "$EXPECTED_SOURCE_SHA"
          git bundle verify "$RUNNER_TEMP/candidate/dependency-candidate.bundle"
          bundle_head="$(git bundle list-heads "$RUNNER_TEMP/candidate/dependency-candidate.bundle" | awk '$2 == "HEAD" { print $1 }')"
          if [[ "$bundle_head" != "$EXPECTED_CANDIDATE_SHA" ]]; then
            echo "Candidate bundle SHA mismatch: expected $EXPECTED_CANDIDATE_SHA, found ${bundle_head:-missing}." >&2
            exit 1
          fi
          git fetch "$RUNNER_TEMP/candidate/dependency-candidate.bundle" HEAD
          git cat-file -e "$EXPECTED_CANDIDATE_SHA^{commit}"
          test "$(git rev-parse "$EXPECTED_CANDIDATE_SHA^1")" = "$EXPECTED_SOURCE_SHA"
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" "$EXPECTED_CANDIDATE_SHA"
          changed_files="$(git diff --name-only "$EXPECTED_SOURCE_SHA" "$EXPECTED_CANDIDATE_SHA" | sort)"
          if ! grep -Fxq 'pnpm-lock.yaml' <<< "$changed_files" || ! grep -Eq '(^|/)package\.json$' <<< "$changed_files"; then
            echo "Candidate bundle contains unexpected changed files:" >&2
            printf '%s\n' "$changed_files" >&2
            exit 1
          fi
          while IFS= read -r path; do
            [[ "$path" == "pnpm-lock.yaml" || "$path" == "package.json" || "$path" == */package.json ]] || { echo "Unexpected candidate path: $path" >&2; exit 1; }
          done <<< "$changed_files"
          node scripts/push-expected-ref.mjs origin "$EXPECTED_CANDIDATE_SHA" refs/heads/dev "$EXPECTED_SOURCE_SHA"

  dispatch:
    name: request-promotion-and-full-ci
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Dispatch promotion and full CI explicitly for GITHUB_TOKEN push
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run promote.yml --repo "$GITHUB_REPOSITORY" --ref dev
          number=""
          attempt=0
          while [[ -z "$number" && "$attempt" -lt 60 ]]; do
            number="$(gh pr list --repo "$GH_REPO" --base main --head dev --state open --json number --jq '.[0].number // empty')"
            if [[ -z "$number" ]]; then
              attempt=$((attempt + 1))
              sleep 5
            fi
          done
          if [[ -z "$number" ]]; then
            echo "Promotion PR did not become available after dispatch; candidate remains on dev for recovery." >&2
            exit 1
          fi
          gh workflow run ci.yml --repo "$GH_REPO" --ref dev
          echo "Candidate published; explicit promotion and full CI dispatch requested for PR #$number." >> "$GITHUB_STEP_SUMMARY"
