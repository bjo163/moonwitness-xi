name: Sync main into dev

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-branch-updates
  cancel-in-progress: false

jobs:
  sync:
    name: merge-main-into-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Synchronize without overwriting concurrent dev work
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: node scripts/sync-main-to-dev.mjs
