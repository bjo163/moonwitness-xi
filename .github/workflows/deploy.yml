name: Staging deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy to production after staging smoke tests pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

jobs:
  staging:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_HOOK_URL: ${{ secrets.STAGING_DEPLOY_HOOK_URL }}
      BASE_URL: ${{ vars.STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require staging configuration
        run: |
          test -n "$DEPLOY_HOOK_URL" || { echo "Configure STAGING_DEPLOY_HOOK_URL in the staging environment" >&2; exit 1; }
          test -n "$BASE_URL" || { echo "Configure STAGING_BASE_URL in the staging environment" >&2; exit 1; }
      - name: Trigger staging deployment
        run: curl --fail --show-error --silent --retry 3 --retry-delay 5 -X POST "$DEPLOY_HOOK_URL"
      - name: Smoke test staging
        run: |
          for attempt in $(seq 1 36); do
            if curl --fail --show-error --silent "$BASE_URL/readyz" >/dev/null; then
              curl --fail --show-error --silent "$BASE_URL/livez" >/dev/null
              curl --fail --show-error --silent "$BASE_URL/" | grep -q 'MoonWitness'
              exit 0
            fi
            sleep 10
          done
          echo "Staging did not become ready within six minutes" >&2
          exit 1

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_HOOK_URL }}
      BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
    steps:
      - name: Require production configuration
        run: |
          test -n "$DEPLOY_HOOK_URL" || { echo "Configure PRODUCTION_DEPLOY_HOOK_URL in the protected production environment" >&2; exit 1; }
          test -n "$BASE_URL" || { echo "Configure PRODUCTION_BASE_URL in the protected production environment" >&2; exit 1; }
      - name: Trigger production deployment
        run: curl --fail --show-error --silent --retry 3 --retry-delay 5 -X POST "$DEPLOY_HOOK_URL"
      - name: Smoke test production
        run: |
          for attempt in $(seq 1 36); do
            if curl --fail --show-error --silent "$BASE_URL/readyz" >/dev/null; then
              curl --fail --show-error --silent "$BASE_URL/livez" >/dev/null
              curl --fail --show-error --silent "$BASE_URL/" | grep -q 'MoonWitness'
              exit 0
            fi
            sleep 10
          done
          echo "Production did not become ready within six minutes" >&2
          exit 1
