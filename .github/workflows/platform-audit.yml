name: Monthly platform audit

on:
  schedule:
    - cron: '17 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: monthly-platform-audit
  cancel-in-progress: false

jobs:
  audit:
    name: inventory platform and retention
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      status: ${{ steps.generate.outputs.status }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore the preceding monthly baseline when available
        id: previous
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          previous_run="$(gh api "repos/$GH_REPO/actions/workflows/platform-audit.yml/runs?branch=main&status=completed&per_page=100" --jq '.workflow_runs | map(select(.conclusion == "success")) | .[0].id // empty')"
          if [[ -z "$previous_run" ]]; then
            echo 'No previous successful audit run is available.'
            exit 0
          fi
          if ! gh run download "$previous_run" --repo "$GH_REPO" --name platform-audit-baseline --dir platform-audit-previous; then
            echo 'Previous run had no retained baseline artifact; current report will start a new trend.'
          fi
      - name: Generate read-only platform audit
        id: generate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ -f platform-audit-previous/platform-audit-baseline.json ]]; then
            node scripts/platform-audit.mjs --output platform-audit-baseline.json --previous platform-audit-previous/platform-audit-baseline.json
          else
            node scripts/platform-audit.mjs --output platform-audit-baseline.json
          fi
          status="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const report = JSON.parse(await readFile('platform-audit-baseline.json', 'utf8')); process.stdout.write(report.status);")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Write concise audit summary
        run: node scripts/write-platform-audit-summary.mjs platform-audit-baseline.json
      - name: Upload audit baseline
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-audit-baseline
          path: platform-audit-baseline.json
          if-no-files-found: error
          retention-days: 90
      - name: Require complete coverage for a successful audit
        if: steps.generate.outputs.status != 'complete'
        run: |
          echo 'The monthly audit is partial; its report was uploaded and a maintenance incident will be recorded.' >&2
          exit 1

  report-failure:
    name: Report monthly platform audit failure
    if: always() && (needs.audit.result == 'failure' || needs.audit.outputs.status == 'partial') && github.ref == 'refs/heads/main'
    needs: [audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: maintenance-incident-platform-audit
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Upsert the monthly platform audit incident
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          INCIDENT_CATEGORY: platform-audit
          INCIDENT_STATUS: failed
        run: node scripts/maintenance-incident.mjs

  resolve-failure:
    name: Resolve recovered monthly platform audit incident
    if: always() && needs.audit.result == 'success' && needs.audit.outputs.status == 'complete' && github.ref == 'refs/heads/main'
    needs: [audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: maintenance-incident-platform-audit
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Resolve the incident after a complete successful audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          INCIDENT_CATEGORY: platform-audit
          INCIDENT_STATUS: recovered
        run: node scripts/maintenance-incident.mjs
