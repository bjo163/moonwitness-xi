name: Ubuntu runner candidate

# Parked from scheduled/push triggers on 2026-10-24: the repo owner asked for a
# thin delivery path, so this workflow runs only when started by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-runner-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Record runner image before dependency installation
        run: |
          printf 'Runner image: %s\n' "$ImageOS $ImageVersion"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Record toolchain versions
        run: |
          node --version
          pnpm --version
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:unit:built
      - run: pnpm test:architecture
      - run: pnpm architecture:check:built
      - run: pnpm assets:check:docs
      - run: pnpm docs:build:built
      - run: pnpm --filter @moonwitness/board lint

  postgres-integration:
    name: PostgreSQL integration (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      REQUIRE_POSTGRES_TESTS: 'true'
    steps:
      - name: Record runner image before dependency installation
        run: |
          printf 'Runner image: %s\n' "$ImageOS $ImageVersion"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Record database and toolchain versions
        run: |
          node --version
          pnpm --version
          psql "$POSTGRES_TEST_URL" -Atc 'SHOW server_version'
      - run: pnpm test:integration
