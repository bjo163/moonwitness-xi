name: Documentation Pages

on:
  push:
    branches: [dev, main]
    paths:
      - 'apps/docs/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'docs/**'
      - 'README.md'
      - 'ROADMAP.md'
      - 'scripts/docs/**'
      - 'scripts/check-docs-publication.mjs'
      - 'scripts/classify-docs-change.mjs'
      - 'scripts/docs-change-policy.mjs'
      - 'scripts/main-ci-policy.mjs'
      - 'scripts/write-docs-metadata.mjs'
      - 'packages/assets/**'
      - 'packages/ui/**'
      - '.github/workflows/pages.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch, release tag, or commit SHA to build
        required: true
        type: string
      publish:
        description: Publish Pages (requires source_ref main or a release tag)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  change-detection:
    name: Detect documentation changes
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      docs_only: ${{ steps.classification.outputs.docs_only }}
      release_change_kind: ${{ steps.classification.outputs.release_change_kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect docs-related paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'apps/docs/**'
              - 'apps/api/**'
              - 'packages/**'
              - 'docs/**'
              - 'README.md'
              - 'ROADMAP.md'
              - 'scripts/docs/**'
              - 'packages/assets/**'
              - 'packages/ui/**'
              - '.github/workflows/pages.yml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
      - name: Classify docs-only content separately from executable changes
        id: classification
        if: steps.filter.outputs.docs == 'true'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "release_change_kind=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_result="$(node scripts/classify-docs-change.mjs "$BASE_SHA" "$HEAD_SHA")"
          echo "docs_only=$(jq -r '.docsOnly' <<< "$docs_result")" >> "$GITHUB_OUTPUT"
          release_result="$(node scripts/classify-release-commits.mjs "$BASE_SHA" "$HEAD_SHA" --summary)"
          echo "release_change_kind=$(jq -r '.changeKind' <<< "$release_result")" >> "$GITHUB_OUTPUT"
          if [[ "$(jq -r '.docsOnly' <<< "$docs_result")" == "true" && "$(jq -r '.changeKind' <<< "$release_result")" != "none" ]]; then
            echo "Pure documentation content unexpectedly classifies as an application release change." >&2
            exit 1
          fi
          {
            echo '### Documentation change classification'
            echo "- Docs-only content: $(jq -r '.docsOnly' <<< "$docs_result")"
            echo "- Application release change: $(jq -r '.changeKind' <<< "$release_result")"
            echo "- Source SHA: \`$HEAD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
  build:
    name: Build and verify documentation
    needs: change-detection
    if: always() && (needs.change-detection.result == 'skipped' || needs.change-detection.outputs.docs == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate dispatch trust policy
        id: policy
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          PUBLISH: ${{ inputs.publish }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == "true" && "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Pages publication can only be dispatched from trusted main." >&2
            exit 1
          fi
          if [[ "$PUBLISH" == "true" && "$SOURCE_REF" != "main" && ! "$SOURCE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Publication accepts only main or a semantic release tag; got $SOURCE_REF" >&2
            exit 1
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Reject release-tag publication until stable release contracts are ready
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true && startsWith(inputs.source_ref, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json tagName,publishedAt --jq 'select(.publishedAt != null) | .tagName' | grep -Fx "$RELEASE_TAG"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$release_sha" refs/remotes/origin/main; then
            echo "Release tag $RELEASE_TAG does not point to a commit reachable from trusted main." >&2
            exit 1
          fi
      - name: Select event source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_REF: ${{ inputs.source_ref }}
          PUBLISH: ${{ inputs.publish }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$PUBLISH" == "true" && "$SOURCE_REF" == v* ]]; then
              if [[ "$EVENT_REF" != "refs/heads/main" ]]; then
                echo "Release tag publication must be dispatched from main." >&2
                exit 1
              fi
              echo "ref=refs/tags/$SOURCE_REF" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$PUBLISH" == "true" && "$SOURCE_REF" == "main" ]]; then
              echo "ref=$EVENT_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0
      - name: Record immutable source SHA
        id: source_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require exact tag content for release-tag publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true && startsWith(inputs.source_ref, 'v')
        env:
          RELEASE_TAG: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ steps.source_sha.outputs.sha }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$release_sha" != "$SOURCE_SHA" ]]; then
            echo "Selected release tag resolves to $release_sha, but checkout is $SOURCE_SHA." >&2
            exit 1
          fi
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Install Chromium for portal browser tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and test documentation portal
        run: pnpm test:docs-portal
      - name: Require successful CI gate for trusted main source
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source_sha.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runs="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&head_sha=$SOURCE_SHA&event=push&per_page=100")"
            run="$(jq --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push")] | sort_by(.created_at, .run_attempt) | last // empty' <<< "$runs")"
            if [[ -n "$run" ]]; then
              run_id="$(jq -r '.id' <<< "$run")"
              run_attempt="$(jq -r '.run_attempt' <<< "$run")"
              run_status="$(jq -r '.status' <<< "$run")"
              run_conclusion="$(jq -r '.conclusion // ""' <<< "$run")"
              if [[ "$run_status" == "completed" ]]; then
                if [[ "$run_conclusion" != "success" ]]; then
                  echo "The newest main push CI run for $SOURCE_SHA concluded $run_conclusion." >&2
                  exit 1
                fi
                jobs="$(gh api "repos/$GH_REPO/actions/runs/$run_id/attempts/$run_attempt/jobs?per_page=100")"
                gate="$(jq '[.jobs[] | select(.name == "ci-gate")] | last // empty' <<< "$jobs")"
                if [[ "$(jq -r 'if type == "object" then (.conclusion // "") else "" end' <<< "$gate")" != "success" ]]; then
                  echo "The main push CI run has no successful ci-gate for $SOURCE_SHA." >&2
                  exit 1
                fi
                echo "Verified main push ci-gate success for source SHA $SOURCE_SHA (run $run_id)."
                exit 0
              fi
            fi
            echo "Waiting for main push CI and ci-gate on source SHA $SOURCE_SHA (attempt $attempt/60)."
            sleep 15
          done
          echo "Timed out waiting for successful ci-gate on $SOURCE_SHA." >&2
          exit 1
      - name: Confirm docs-only source does not request an app version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.change-detection.outputs.docs_only == 'true'
        env:
          RELEASE_CHANGE_KIND: ${{ needs.change-detection.outputs.release_change_kind }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANGE_KIND" != "none" ]]; then
            echo "Docs-only change must have release change kind none; got $RELEASE_CHANGE_KIND." >&2
            exit 1
          fi
      - name: Test publication safety contracts
        run: pnpm test:docs-publication
      - name: Scan public output for secrets and unsafe files
        run: node scripts/check-docs-publication.mjs apps/docs/dist
      - name: Write source metadata
        env:
          SOURCE_SHA: ${{ steps.source_sha.outputs.sha }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
          RUN_ID: ${{ github.run_id }}
          DOCS_ONLY: ${{ needs.change-detection.outputs.docs_only }}
          RELEASE_CHANGE_KIND: ${{ needs.change-detection.outputs.release_change_kind }}
        run: node scripts/write-docs-metadata.mjs apps/docs/dist
      - name: Upload development preview artifact
        if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && inputs.publish != true)
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-${{ steps.source_sha.outputs.sha }}
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 7
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    name: Publish trusted documentation
    needs: [change-detection, build]
    if: always() && needs.build.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: repository-write-coordinator
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  report-failure:
    name: Report documentation publication failure
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    needs: [change-detection, build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: repository-write-coordinator
      cancel-in-progress: false
    permissions:
      issues: write
      actions: read
    steps:
      - name: Find or open the docs publication incident issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$GH_REPO" --label docs-publication --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh label create docs-publication --repo "$GH_REPO" --color 1D76DB --description 'Documentation publication status' --force
            url="$(gh issue create --repo "$GH_REPO" --title "Documentation publication failed: $SOURCE_REF" --label docs-publication --body "The static documentation publication check failed.\n\n- Source ref: \`$SOURCE_REF\`\n- Event SHA: \`$SOURCE_SHA\`\n- Workflow run: https://github.com/$GH_REPO/actions/runs/$RUN_ID\n\nReview the workflow logs, fix the issue, then use the Pages workflow dispatch to retry from the verified source. This issue is not an application release signal.")"
            number="${url##*/}"
          fi
          gh issue comment "$number" --repo "$GH_REPO" --body "Documentation publication attempt failed for \`$SOURCE_REF\` (event SHA \`$SOURCE_SHA\`). Workflow: https://github.com/$GH_REPO/actions/runs/$RUN_ID. Inspect failing job logs, correct the problem, and retry Pages from a verified ref. No application release or version bump is created by this retry."
