name: Roadmap issue sync

on:
  push:
    branches: [dev]
    paths:
      - 'ROADMAP.md'
      - 'docs/roadmap/**'
      - 'scripts/roadmap/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-pnpm/action.yml'
      - '.github/workflows/roadmap-issue-plan.yml'
  schedule:
    - cron: '13 9 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the selected issue batch (otherwise this run is read-only)
        required: true
        default: false
        type: boolean
      task_ids:
        description: Comma-separated task IDs; apply is limited to five tasks per run
        required: false
        type: string
      backfill_next_batch:
        description: Apply the next bounded create/update batch from the latest dev source
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: roadmap-issue-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Build read-only issue reconciliation plan
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      checks: read
      issues: read
    env:
      TASK_IDS: ${{ inputs.task_ids }}
    outputs:
      changed_task_ids: ${{ steps.changed.outputs.task_ids }}
      source_sha: ${{ steps.reconcile.outputs.source_sha }}
      backfill_task_ids: ${{ steps.reconcile.outputs.backfill_task_ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Select task IDs changed by this push
        id: changed
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          set -euo pipefail
          task_ids="$(node scripts/roadmap/changed-task-ids.mjs --base "$GITHUB_EVENT_BEFORE" --head "$GITHUB_SHA")"
          echo "task_ids=$task_ids" >> "$GITHUB_OUTPUT"
          if [[ -n "$task_ids" ]]; then
            echo "Changed roadmap tasks selected for bounded automatic sync: $task_ids"
          else
            echo 'No issue-owned roadmap task content changed; no issue writes will run.'
          fi
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
      - name: Plan exact source SHA without issue writes
        id: reconcile
        run: |
          set -euo pipefail
          snapshot_file=.roadmap-lifecycle-snapshot.json
          audit_file=.roadmap-issue-audit.json
          plan_file=.roadmap-issue-plan.json
          trap 'rm -f "$snapshot_file" "$audit_file" "$plan_file"' EXIT
          git fetch origin dev main --tags --no-recurse-submodules
          source_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' && "$source_sha" != "$(git rev-parse refs/remotes/origin/dev)" ]]; then
            echo 'Scheduled backfill checkout is not the latest dev head; refusing stale issue writes.' >&2
            exit 2
          fi
          if [[ "$GITHUB_EVENT_NAME" != 'schedule' && "$source_sha" != "$GITHUB_SHA" ]]; then
            echo 'Plan checkout does not match its triggering event SHA.' >&2
            exit 2
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          export SOURCE_SHA="$source_sha"
          node scripts/roadmap/audit-issues.mjs --quiet --output "$audit_file"
          node scripts/roadmap/collect-lifecycle-snapshot-cli.mjs
          args=(--quiet)
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            TASK_IDS="$TASK_IDS_AUTO"
          fi
          if [[ -n "$TASK_IDS" ]]; then
            args+=(--task-ids "$TASK_IDS")
          fi
          node scripts/roadmap/sync-issues.mjs "${args[@]}" --lifecycle-snapshot "$snapshot_file" --output "$plan_file"
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' || "$BACKFILL_NEXT_BATCH" == 'true' ]]; then
            backfill_ids="$(node scripts/roadmap/select-issue-sync-batch.mjs "$plan_file")"
            echo "backfill_task_ids=$backfill_ids" >> "$GITHUB_OUTPUT"
            echo "Next bounded issue sync batch: ${backfill_ids:-none}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TASK_IDS_AUTO: ${{ steps.changed.outputs.task_ids }}
          BACKFILL_NEXT_BATCH: ${{ inputs.backfill_next_batch }}

  apply:
    name: Apply a changed-task, backfill, or explicit bounded issue batch
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.plan.outputs.changed_task_ids != '') || (github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/dev' && ((inputs.backfill_next_batch && needs.plan.outputs.backfill_task_ids != '') || inputs.task_ids != '')) || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && needs.plan.outputs.backfill_task_ids != '')
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: repository-write-coordinator
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      checks: read
      issues: write
    env:
      TASK_IDS: ${{ inputs.task_ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Collect lifecycle evidence and apply selected tasks with fresh-state guards
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            TASK_IDS="$CHANGED_TASK_IDS"
          elif [[ "$BACKFILL_NEXT_BATCH" == 'true' || "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
            TASK_IDS="$BACKFILL_TASK_IDS"
          fi
          if [[ -z "$TASK_IDS" ]]; then
            echo 'Applying roadmap issues requires explicit task IDs.' >&2
            exit 2
          fi
          git fetch origin dev main --tags --no-recurse-submodules
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" || "$(git rev-parse refs/remotes/origin/dev)" != "$SOURCE_SHA" ]]; then
            echo 'The dev source changed after plan selection; refresh the plan before applying.' >&2
            exit 2
          fi
          if (( $(awk -F, '{print NF}' <<< "$TASK_IDS") > 5 )); then
            echo 'Issue sync apply is limited to five task IDs per run.' >&2
            exit 2
          fi
          snapshot_file=.roadmap-lifecycle-snapshot.json
          trap 'rm -f "$snapshot_file"' EXIT
          export SOURCE_SHA
          node scripts/roadmap/collect-lifecycle-snapshot-cli.mjs
          node scripts/roadmap/sync-issues.mjs --quiet --apply --task-ids "$TASK_IDS" --lifecycle-snapshot "$snapshot_file"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHANGED_TASK_IDS: ${{ needs.plan.outputs.changed_task_ids }}
          BACKFILL_TASK_IDS: ${{ needs.plan.outputs.backfill_task_ids }}
          BACKFILL_NEXT_BATCH: ${{ inputs.backfill_next_batch }}
