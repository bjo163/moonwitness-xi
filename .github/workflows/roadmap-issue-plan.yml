name: Roadmap issue sync

on:
  push:
    branches: [dev]
    paths:
      - 'ROADMAP.md'
      - 'docs/roadmap/**'
      - 'scripts/roadmap/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-pnpm/action.yml'
      - '.github/workflows/roadmap-issue-plan.yml'
  schedule:
    - cron: '13 9 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the selected issue batch (otherwise this run is read-only)
        required: true
        default: false
        type: boolean
      task_ids:
        description: Comma-separated task IDs; apply is limited to five tasks per run
        required: false
        type: string
      backfill_next_batch:
        description: Apply the next bounded create/update batch from the latest dev source
        required: true
        default: false
        type: boolean
      stale_sync_retry_count:
        description: Internal bounded retry counter for a stale automatic issue sync
        required: false
        default: 0
        type: number
      batch_continuation_count:
        description: Internal bounded continuation counter for an oversized issue sync batch
        required: false
        default: 0
        type: number

permissions:
  contents: read

concurrency:
  group: roadmap-issue-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Build read-only issue reconciliation plan
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      checks: read
      pull-requests: read
      issues: read
    env:
      TASK_IDS: ${{ inputs.task_ids }}
    outputs:
      changed_task_ids: ${{ steps.changed.outputs.task_ids }}
      source_sha: ${{ steps.reconcile.outputs.source_sha }}
      backfill_task_ids: ${{ steps.reconcile.outputs.backfill_task_ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Select task IDs changed by this push
        id: changed
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          set -euo pipefail
          task_ids="$(node scripts/roadmap/changed-task-ids.mjs --base "$GITHUB_EVENT_BEFORE" --head "$GITHUB_SHA")"
          echo "task_ids=$task_ids" >> "$GITHUB_OUTPUT"
          if [[ -n "$task_ids" ]]; then
            echo "Changed roadmap tasks selected for bounded automatic sync: $task_ids"
          else
            echo 'No issue-owned roadmap task content changed; no issue writes will run.'
          fi
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
      - name: Plan exact source SHA without issue writes
        id: reconcile
        run: |
          set -euo pipefail
          audit_file=.roadmap-issue-audit.json
          plan_file=.roadmap-issue-plan.json
          trap 'rm -f "$audit_file" "$plan_file"' EXIT
          git fetch origin dev main --tags --no-recurse-submodules
          source_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' && "$source_sha" != "$(git rev-parse refs/remotes/origin/dev)" ]]; then
            echo 'Scheduled backfill checkout is not the latest dev head; refusing stale issue writes.' >&2
            exit 2
          fi
          if [[ "$GITHUB_EVENT_NAME" != 'schedule' && "$source_sha" != "$GITHUB_SHA" ]]; then
            echo 'Plan checkout does not match its triggering event SHA.' >&2
            exit 2
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          export SOURCE_SHA="$source_sha"
          node scripts/roadmap/audit-issues.mjs --quiet --output "$audit_file"
          args=(--quiet)
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            TASK_IDS="$TASK_IDS_AUTO"
          fi
          if [[ -n "$TASK_IDS" ]]; then
            args+=(--task-ids "$TASK_IDS")
          fi
          node scripts/roadmap/sync-issues.mjs "${args[@]}" --output "$plan_file"
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' || "$BACKFILL_NEXT_BATCH" == 'true' ]]; then
            backfill_ids="$(node scripts/roadmap/select-issue-sync-batch.mjs "$plan_file")"
            echo "backfill_task_ids=$backfill_ids" >> "$GITHUB_OUTPUT"
            echo "Next bounded issue sync batch: ${backfill_ids:-none}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TASK_IDS_AUTO: ${{ steps.changed.outputs.task_ids }}
          BACKFILL_NEXT_BATCH: ${{ inputs.backfill_next_batch }}

  apply:
    name: Apply a changed-task, backfill, or explicit bounded issue batch
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.plan.outputs.changed_task_ids != '') || (github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/dev' && ((inputs.backfill_next_batch && needs.plan.outputs.backfill_task_ids != '') || inputs.task_ids != '')) || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && needs.plan.outputs.backfill_task_ids != '')
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: roadmap-issue-sync
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      checks: read
      pull-requests: read
      issues: write
    env:
      TASK_IDS: ${{ inputs.task_ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Collect lifecycle evidence and apply selected tasks with fresh-state guards
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            SELECTION_TASK_IDS="$CHANGED_TASK_IDS"
          elif [[ "$BACKFILL_NEXT_BATCH" == 'true' || "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
            SELECTION_TASK_IDS="$BACKFILL_TASK_IDS"
          else
            SELECTION_TASK_IDS="$TASK_IDS"
          fi
          if [[ -z "$SELECTION_TASK_IDS" ]]; then
            echo 'Applying roadmap issues requires explicit task IDs.' >&2
            exit 2
          fi
          batch_file=.roadmap-issue-batches.json
          snapshot_file=.roadmap-lifecycle-snapshot.json
          trap 'rm -f "$batch_file" "$snapshot_file"' EXIT
          export ISSUE_SYNC_TASK_IDS="$SELECTION_TASK_IDS"
          node scripts/roadmap/issue-sync-continuation.mjs prepare
          TASK_IDS="$(jq -r '.applyTaskIds | join(",")' "$batch_file")"
          git fetch origin dev main --tags --no-recurse-submodules
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" || "$(git rev-parse refs/remotes/origin/dev)" != "$SOURCE_SHA" ]]; then
            LATEST_DEV_SHA="$(git rev-parse refs/remotes/origin/dev)" node scripts/roadmap/resume-stale-issue-sync.mjs
            exit 0
          fi
          export SOURCE_SHA
          node scripts/roadmap/collect-lifecycle-snapshot-cli.mjs
          if [[ ! -s "$snapshot_file" ]]; then
            git fetch origin dev --no-recurse-submodules
            latest_dev_sha="$(git rev-parse refs/remotes/origin/dev)"
            if [[ "$latest_dev_sha" != "$SOURCE_SHA" ]]; then
              LATEST_DEV_SHA="$latest_dev_sha" node scripts/roadmap/resume-stale-issue-sync.mjs
              exit 0
            fi
            echo 'Lifecycle collection produced no snapshot while dev remained unchanged.' >&2
            exit 2
          fi
          git fetch origin dev --no-recurse-submodules
          if [[ "$(git rev-parse refs/remotes/origin/dev)" != "$SOURCE_SHA" ]]; then
            LATEST_DEV_SHA="$(git rev-parse refs/remotes/origin/dev)" node scripts/roadmap/resume-stale-issue-sync.mjs
            exit 0
          fi
          node scripts/roadmap/sync-issues.mjs --quiet --apply --task-ids "$TASK_IDS" --lifecycle-snapshot "$snapshot_file"
          node scripts/roadmap/issue-sync-continuation.mjs dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHANGED_TASK_IDS: ${{ needs.plan.outputs.changed_task_ids }}
          BACKFILL_TASK_IDS: ${{ needs.plan.outputs.backfill_task_ids }}
          BACKFILL_NEXT_BATCH: ${{ inputs.backfill_next_batch }}
          STALE_SYNC_RETRY_COUNT: ${{ inputs.stale_sync_retry_count || 0 }}
          BATCH_CONTINUATION_COUNT: ${{ inputs.batch_continuation_count || 0 }}
