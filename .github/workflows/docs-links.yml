name: External documentation links

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-doc-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check external documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check selected external Markdown links with bounded retries
        run: node scripts/check-external-doc-links.mjs
