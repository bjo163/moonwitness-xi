# One-time, read-only recovery of generated public documentation for a stale dev candidate.
# Remove this workflow after the generated files have been committed and verified.
name: Temporary generated-output recovery

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: temporary-generated-output-recovery
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate and report tracked public docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Regenerate public docs and static asset map
        run: |
          pnpm docs:generate
          pnpm assets:export:docs
      - name: Report generated text changes for source-locked recovery
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const changed = execFileSync('git', ['diff', '--name-only', '--'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean);
          const untracked = execFileSync('git', ['ls-files', '--others', '--exclude-standard', '--', 'docs/assets/moonwitness', 'docs/guide/reference'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean);
          const allowed = (path) => path === 'README.md' || path === 'docs/assets/moonwitness/asset-map.json' ||
            /^docs\/guide\/reference\/generated-[\w-]+\.(?:json|md)$/u.test(path);
          if (untracked.length || changed.some((path) => !allowed(path))) {
            throw new Error('Unexpected generated path(s): ' + JSON.stringify({ changed, untracked }));
          }
          for (const path of changed) {
            const contents = readFileSync(path, 'utf8');
            if (contents.length > 500000) throw new Error('Generated file too large to report: ' + path);
            let i = 0;
            for (let start = 0; start < contents.length; start += 2000) {
              console.log('MWGEN_CHUNK:' + JSON.stringify({ path, i: i++, data: contents.slice(start, start + 2000) }));
            }
            console.log('MWGEN_FILE:' + JSON.stringify({ path, chunks: i, characters: contents.length }));
          }
          console.log('MWGEN_DONE:' + JSON.stringify({ changed, source: process.env.GITHUB_SHA }));
          NODE
