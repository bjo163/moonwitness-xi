name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to verify for a non-publishing branch dry run (with or without the v prefix)
        required: false
        type: string
      publish:
        description: Publish the verified image and GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      REQUIRE_POSTGRES_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '11'
      - name: Verify workspace release version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="$RELEASE_VERSION"
          if [[ "$version" != v* ]]; then version="v$version"; fi
          pnpm release:check "$version"
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm docs:check
      - run: pnpm --filter @moonwitness/board lint
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: docker build --tag moonwitness-api:"$GITHUB_REF_NAME" .
      - run: docker build --target board-runtime --tag moonwitness-board:"$GITHUB_REF_NAME" .
      - name: Validate production Compose configuration
        env:
          DATABASE_URL: postgresql://moonwitness:ci-password@postgres.example:5432/moonwitness
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
        run: docker compose -f docker-compose.production.yml config --quiet

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: repository-write-coordinator
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API image to GitHub Container Registry
        env:
          IMAGE_URI: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          image="$(printf '%s' "$IMAGE_URI" | tr '[:upper:]' '[:lower:]')"
          docker buildx build --push --tag "$image:$TAG" --tag "$image:latest" .
      - name: Publish Board image to GitHub Container Registry
        env:
          IMAGE_URI: ghcr.io/${{ github.repository }}-board
          TAG: ${{ github.ref_name }}
        run: |
          image="$(printf '%s' "$IMAGE_URI" | tr '[:upper:]' '[:lower:]')"
          docker buildx build --target board-runtime --push --tag "$image:$TAG" --tag "$image:latest" .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
