name: Roadmap issue intake
run-name: Roadmap intake comment ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: roadmap-issue-intake-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  proposal:
    name: Verify maintainer and report inert proposal
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Skip previously reported issue comment
        id: dedupe
        run: node scripts/roadmap/issue-intake-dedupe.mjs >> "$GITHUB_OUTPUT"
        env:
          GITHUB_COMMENT_ID: ${{ github.event.comment.id }}
          GITHUB_COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Require the least-privilege GitHub App permission verifier
        if: steps.dedupe.outputs.skip != 'true'
        env:
          APP_CLIENT_ID: ${{ vars.ROADMAP_INTAKE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ROADMAP_INTAKE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo 'Configure ROADMAP_INTAKE_APP_CLIENT_ID and ROADMAP_INTAKE_APP_PRIVATE_KEY for Metadata: read permission verification.' >&2
            exit 2
          fi
      - name: Mint repository-scoped metadata-read token
        id: intake-token
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          client-id: ${{ vars.ROADMAP_INTAKE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROADMAP_INTAKE_APP_PRIVATE_KEY }}
          permission-metadata: read
      - name: Verify actor and report a read-only proposal
        if: steps.dedupe.outputs.skip != 'true'
        run: node scripts/roadmap/run-issue-intake.mjs >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ steps.intake-token.outputs.token }}
      - name: Report already processed comment
        if: steps.dedupe.outputs.skip == 'true'
        run: echo 'A successful intake for this exact comment already exists; no duplicate proposal was emitted.' >> "$GITHUB_STEP_SUMMARY"
