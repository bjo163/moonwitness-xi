name: Roadmap issue intake

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: roadmap-issue-intake-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  proposal:
    name: Verify maintainer and report inert proposal
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify actor and report a read-only proposal
        run: node scripts/roadmap/run-issue-intake.mjs >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
